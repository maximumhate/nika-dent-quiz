services:
  nika-dent-quiz:
    build:
      context: .
    container_name: ${CONTAINER_NAME:-nika-dent-quiz}
    restart: unless-stopped
    depends_on:
      nika-dent-api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      APP_PORT: ${APP_PORT:-8080}
      CONTAINER_NAME: ${CONTAINER_NAME:-nika-dent-quiz}

  nika-dent-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ${API_CONTAINER_NAME:-nika-dent-api}
    restart: unless-stopped
    environment:
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_SHEET_NAME: ${GOOGLE_SHEET_NAME:-Результаты}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${GOOGLE_SERVICE_ACCOUNT_JSON_B64:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
